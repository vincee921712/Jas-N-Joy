<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <!-- Subtle organic bakery motifs: cakes, rolling pin, cupcake, wheat stalk, whisk, croissant -->
  <g stroke="#92400E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <!-- Tiered Cake motif (Top-Left) -->
    <g transform="translate(30, 30)">
      <path d="M12 28h24v16H12z" />
      <path d="M16 16h16v12H16z" />
      <path d="M20 8h8v8h-8z" />
      <path d="M24 2v4" />
      <circle cx="24" cy="2" r="1.5" fill="#92400E" />
      <path d="M8 44h32" />
    </g>

    <!-- Wheat stalks (Top-Right) -->
    <g transform="translate(230, 20)">
      <path d="M20 45C20 30 25 15 35 5" />
      <path d="M20 35c-5-2-7-6-6-10 4 1 7 5 6 10z" />
      <path d="M23 27c5-2 7-6 6-10-4 1-7 5-6 10z" />
      <path d="M21 21c-5-2-7-6-6-10 4 1 7 5 6 10z" />
      <path d="M25 14c5-2 7-6 6-10-4 1-7 5-6 10z" />
    </g>

    <!-- Rolling Pin (Center-Left) -->
    <g transform="translate(40, 160) rotate(-25)">
      <rect x="15" y="6" width="38" height="12" rx="3" />
      <path d="M8 12h7m38 0h7" />
    </g>

    <!-- Cupcake with frosting swirl & cherry (Center-Right) -->
    <g transform="translate(220, 150)">
      <path d="M10 22l4 18h20l4-18z" />
      <path d="M8 22c0-4 4-7 8-7 2-3 6-5 10-4 3 0 7 2 8 6 4 1 6 3 6 5z" />
      <circle cx="25" cy="8" r="2.5" fill="#92400E" />
      <path d="M26 6c2-4 5-5 8-4" />
      <path d="M14 26v10m8-10v10m8-10v10" stroke-width="0.8" />
    </g>

    <!-- Whisk (Bottom-Left) -->
    <g transform="translate(60, 240) rotate(35)">
      <path d="M12 40v14" stroke-width="2" />
      <path d="M12 40c-7-6-9-16-6-24 3-8 9-12 12-12s9 4 12 12c3 8 1 18-6 24" />
      <path d="M12 40c-3-6-4-15-2-22s6-12 8-12 6 5 8 12 1 16-2 22" />
      <path d="M18 4v36" />
    </g>

    <!-- Croissant / Pastry (Bottom-Right) -->
    <g transform="translate(200, 245)">
      <path d="M8 26c4-10 16-16 28-14 12 2 20 12 22 22-8-3-15-5-24-4-9 1-18 4-26-4z" />
      <path d="M20 16c4 3 6 7 7 12" />
      <path d="M32 15c3 4 4 8 4 13" />
      <path d="M44 19c2 3 3 7 3 11" />
    </g>

    <!-- Small decorative sparkle star accents scattered -->
    <path d="M160 50l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#92400E" opacity="0.6" stroke="none" />
    <path d="M130 180l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#92400E" opacity="0.5" stroke="none" />
    <path d="M150 280l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#92400E" opacity="0.6" stroke="none" />
    <path d="M280 110l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#92400E" opacity="0.4" stroke="none" />
    <path d="M30 110l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#92400E" opacity="0.4" stroke="none" />
  </g>
</svg>
